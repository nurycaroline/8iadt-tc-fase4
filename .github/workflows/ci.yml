name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instala dependências do serviço de IA
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
      - name: Lint (ruff)
        run: ruff check scripts ai-service
      - name: Testes (pytest)
        run: pytest -q

  node:
    name: Node (eslint + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instala dependências
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Testes (jest)
        run: npm test
