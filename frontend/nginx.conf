# nginx do dashboard: serve a SPA e faz proxy das rotas da API + WebSocket para o backend Node.
upstream backend {
  server backend:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança (Fase 7 — F7-06 / docs/07 §2). HSTS só faz sentido sob HTTPS e é
  # adicionado na configuração TLS (nginx.tls.conf).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "0" always;

  # API REST do backend.
  location ~ ^/(pacientes|casos|analisar|health|ready) {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket (socket.io) — exige upgrade de conexão.
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # SPA: qualquer outra rota cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
