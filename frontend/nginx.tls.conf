# Configuração nginx com TLS (Fase 7 — F7-02 / docs/07 §2: HTTPS/TLS em trânsito).
#
# Opt-in: substitui a nginx.conf (HTTP) quando há certificado disponível. Use com o override
# docker-compose.tls.yml, que monta os certificados em /etc/nginx/certs e injeta esta config.
# Sem certificado, mantenha a nginx.conf (HTTP) — fallback documentado (DD10).
#
# Gere um certificado autoassinado para desenvolvimento com scripts/gerar-cert-dev.sh; em produção
# use o certificado gerenciado da nuvem (Azure/ingress) ou Let's Encrypt.
upstream backend {
  server backend:3000;
}

# Redireciona HTTP → HTTPS.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Upload de áudio: alinhado ao limite do multer no backend (50MB). O padrão do nginx é 1MB,
  # o que rejeitava áudios maiores com 413 antes de chegar ao backend.
  client_max_body_size 50m;

  # Cabeçalhos de segurança + HSTS (transporte seguro forçado).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "0" always;

  # API REST do backend.
  location ~ ^/(pacientes|casos|analisar|health|ready) {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # WebSocket (socket.io) — exige upgrade de conexão.
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # SPA: qualquer outra rota cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
